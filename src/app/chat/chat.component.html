<div class="chat">
  <div class="chat__messages" #chatMessagesContainer>
    <div
      *ngFor="let message of messages; let i = index"
      class="chat__message-group"
    >
      <div
        class="chat__separator"
        *ngIf="i === firstAgentMessageIndex && message.senderType === 2"
      >
        <svg
          width="100%"
          height="14"
          viewBox="0 0 327 14"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <line x1="132.5" y1="7.5" y2="7.5" stroke="#AD49E1" />
          <path
            d="M162.891 0.464864C162.892 0.460907 162.893 0.458928 162.893 0.458012C163.067 -0.152671 163.933 -0.152671 164.107 0.458012C164.107 0.458928 164.108 0.460907 164.109 0.464864C164.112 0.475291 164.113 0.480505 164.115 0.4854C164.924 3.34287 167.157 5.57619 170.015 6.38539C170.019 6.38678 170.025 6.38825 170.035 6.39119C170.039 6.3923 170.041 6.39286 170.042 6.39312C170.653 6.56727 170.653 7.43274 170.042 7.60688C170.041 7.60714 170.039 7.6077 170.035 7.60881C170.025 7.61175 170.019 7.61322 170.015 7.61461C167.157 8.42381 164.924 10.6571 164.115 13.5146C164.113 13.5195 164.112 13.5247 164.109 13.5351C164.108 13.5391 164.107 13.5411 164.107 13.542C163.933 14.1527 163.067 14.1527 162.893 13.542C162.893 13.5411 162.892 13.5391 162.891 13.5351C162.888 13.5247 162.887 13.5195 162.885 13.5146C162.076 10.6571 159.843 8.42381 156.985 7.61461C156.981 7.61322 156.975 7.61175 156.965 7.60881C156.961 7.6077 156.959 7.60714 156.958 7.60688C156.347 7.43274 156.347 6.56727 156.958 6.39312C156.959 6.39286 156.961 6.3923 156.965 6.39119C156.975 6.38825 156.981 6.38678 156.985 6.38539C159.843 5.57619 162.076 3.34287 162.885 0.4854C162.887 0.480505 162.888 0.475291 162.891 0.464864Z"
            fill="#AD49E1"
          />
          <line x1="327" y1="7.5" x2="194.5" y2="7.5" stroke="#AD49E1" />
        </svg>
      </div>

      <div
        class="chat__message-container"
        [class.chat__message-container--user]="message.senderType === 1"
      >
        <div
          class="chat__avatar"
          [class.chat__avatar--hidden]="
            i > 0 && messages[i - 1].senderType === message.senderType
          "
        >
          @if (message.senderType === 3) {
          <span class="chat__avatar-wrapper chat__avatar-wrapper--assistant">
            <svg
              class="chat__avatar-image"
              viewBox="0 0 55 53"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M8.53125 19.1353C8.53125 12.2804 14.0883 6.72339 20.9432 6.72339H41.6298C48.4847 6.72339 54.0418 12.2804 54.0418 19.1353V52.2339H20.9432C14.0883 52.2339 8.53125 46.6769 8.53125 39.8219V19.1353Z"
                fill="#E5E5E5"
              />
              <path
                d="M0 12.412C0 5.55702 5.55702 0 12.412 0H33.0985C39.9535 0 45.5105 5.55702 45.5105 12.412V33.0985C45.5105 39.9535 39.9535 45.5105 33.0985 45.5105H0V12.412Z"
                fill="white"
              />
              <path
                d="M14.3684 15.2203C14.3696 15.2162 14.3701 15.2142 14.3704 15.2132C14.5505 14.5816 15.4457 14.5816 15.6258 15.2132C15.6261 15.2142 15.6267 15.2162 15.6278 15.2203C15.6309 15.2311 15.6324 15.2365 15.6338 15.2416C16.4708 18.1971 18.7808 20.5071 21.7364 21.3441C21.7414 21.3455 21.7468 21.3471 21.7576 21.3501C21.7617 21.3512 21.7637 21.3518 21.7647 21.3521C22.3963 21.5322 22.3963 22.4274 21.7647 22.6075C21.7637 22.6078 21.7617 22.6084 21.7576 22.6095C21.7468 22.6126 21.7414 22.6141 21.7364 22.6155C18.7808 23.4525 16.4708 25.7625 15.6338 28.7181C15.6324 28.7231 15.6309 28.7285 15.6278 28.7393C15.6267 28.7434 15.6261 28.7454 15.6258 28.7464C15.4457 29.378 14.5505 29.378 14.3704 28.7464C14.3701 28.7454 14.3696 28.7434 14.3684 28.7393C14.3654 28.7285 14.3638 28.7231 14.3624 28.7181C13.5254 25.7625 11.2154 23.4525 8.25988 22.6155C8.25481 22.6141 8.24942 22.6126 8.23864 22.6095C8.23454 22.6084 8.2325 22.6078 8.23155 22.6075C7.5999 22.4274 7.5999 21.5322 8.23155 21.3521C8.2325 21.3518 8.23454 21.3512 8.23864 21.3501C8.24942 21.3471 8.25481 21.3455 8.25988 21.3441C11.2154 20.5071 13.5254 18.1971 14.3624 15.2416C14.3638 15.2365 14.3654 15.2311 14.3684 15.2203Z"
                fill="#AD49E1"
              />
              <path
                d="M36.7198 21.8503C36.7198 24.9207 34.2886 27.4098 31.2896 27.4098C28.2906 27.4098 25.8594 24.9207 25.8594 21.8503C25.8594 18.7799 28.2906 16.2908 31.2896 16.2908C34.2886 16.2908 36.7198 18.7799 36.7198 21.8503Z"
                fill="#AD49E1"
              />
            </svg>
          </span>
          } @else if (needsAgent || message.senderType === 2) {
          <span class="chat__avatar-wrapper chat__avatar-wrapper--agent">
            <svg
              class="chat__avatar-image"
              viewBox="0 0 12 14"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M5.99479 5.66658C7.46755 5.66658 8.66146 4.47268 8.66146 2.99992C8.66146 1.52716 7.46755 0.333252 5.99479 0.333252C4.52203 0.333252 3.32812 1.52716 3.32812 2.99992C3.32812 4.47268 4.52203 5.66658 5.99479 5.66658Z"
                fill="#AD49E1"
              />
              <path
                d="M11.3307 10.6665C11.3307 12.3232 11.3307 13.6665 5.9974 13.6665C0.664062 13.6665 0.664062 12.3232 0.664062 10.6665C0.664062 9.00984 3.05206 7.6665 5.9974 7.6665C8.94273 7.6665 11.3307 9.00984 11.3307 10.6665Z"
                fill="#AD49E1"
              />
            </svg>
          </span>
          }
        </div>
        <app-card
          variant="rounded"
          [class]="
            'chat__message ' +
            (message.senderType === 1
              ? 'chat__message--user'
              : 'chat__message--assistant')
          "
        >
          <app-card-content>
            <div class="chat__message-content">
              <app-markdown-renderer
                [content]="cleanMessageContent(message.messageContent)"
                [inline]="false"
                [cssClass]="'prose' + (message.senderType === 1 ? ' prose-invert' : '')"
                [dir]="currentLang === 'ar' ? 'rtl' : 'ltr'"
              >
              </app-markdown-renderer>
            </div>
          </app-card-content>
        </app-card>
      </div>
    </div>

    <div
      *ngIf="assistantStatus === 'typing' && firstAgentMessageIndex === -1"
      class="chat__typing"
    >
      <div class="chat__avatar">
        <span class="chat__avatar-wrapper chat__avatar-wrapper--agent">
          <svg
            class="chat__avatar-image"
            viewBox="0 0 55 53"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M8.53125 19.1353C8.53125 12.2804 14.0883 6.72339 20.9432 6.72339H41.6298C48.4847 6.72339 54.0418 12.2804 54.0418 19.1353V52.2339H20.9432C14.0883 52.2339 8.53125 46.6769 8.53125 39.8219V19.1353Z"
              fill="#E5E5E5"
            />
            <path
              d="M0 12.412C0 5.55702 5.55702 0 12.412 0H33.0985C39.9535 0 45.5105 5.55702 45.5105 12.412V33.0985C45.5105 39.9535 39.9535 45.5105 33.0985 45.5105H0V12.412Z"
              fill="white"
            />
            <path
              d="M14.3684 15.2203C14.3696 15.2162 14.3701 15.2142 14.3704 15.2132C14.5505 14.5816 15.4457 14.5816 15.6258 15.2132C15.6261 15.2142 15.6267 15.2162 15.6278 15.2203C15.6309 15.2311 15.6324 15.2365 15.6338 15.2416C16.4708 18.1971 18.7808 20.5071 21.7364 21.3441C21.7414 21.3455 21.7468 21.3471 21.7576 21.3501C21.7617 21.3512 21.7637 21.3518 21.7647 21.3521C22.3963 21.5322 22.3963 22.4274 21.7647 22.6075C21.7637 22.6078 21.7617 22.6084 21.7576 22.6095C21.7468 22.6126 21.7414 22.6141 21.7364 22.6155C18.7808 23.4525 16.4708 25.7625 15.6338 28.7181C15.6324 28.7231 15.6309 28.7285 15.6278 28.7393C15.6267 28.7434 15.6261 28.7454 15.6258 28.7464C15.4457 29.378 14.5505 29.378 14.3704 28.7464C14.3701 28.7454 14.3696 28.7434 14.3684 28.7393C14.3654 28.7285 14.3638 28.7231 14.3624 28.7181C13.5254 25.7625 11.2154 23.4525 8.25988 22.6155C8.25481 22.6141 8.24942 22.6126 8.23864 22.6095C8.23454 22.6084 8.2325 22.6078 8.23155 22.6075C7.5999 22.4274 7.5999 21.5322 8.23155 21.3521C8.2325 21.3518 8.23454 21.3512 8.23864 21.3501C8.24942 21.3471 8.25481 21.3455 8.25988 21.3441C11.2154 20.5071 13.5254 18.1971 14.3624 15.2416C14.3638 15.2365 14.3654 15.2311 14.3684 15.2203Z"
              fill="#AD49E1"
            />
            <path
              d="M36.7198 21.8503C36.7198 24.9207 34.2886 27.4098 31.2896 27.4098C28.2906 27.4098 25.8594 24.9207 25.8594 21.8503C25.8594 18.7799 28.2906 16.2908 31.2896 16.2908C34.2886 16.2908 36.7198 18.7799 36.7198 21.8503Z"
              fill="#AD49E1"
            />
          </svg>
        </span>
      </div>
      <app-card
        variant="rounded"
        class="chat__message chat__message--assistant"
      >
        <app-card-content>
          <div id="wave">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </app-card-content>
      </app-card>
    </div>
    <div *ngIf="loading" class="chat__loading">
      <app-loading variant="primary" />
    </div>
  </div>

  <form (ngSubmit)="handleSendMessage()" class="chat__input-container">
    <div class="chat__input-wrapper">
      <input
        type="text"
        [(ngModel)]="messageContent"
        name="messageContent"
        [placeholder]="'ChatPlaceholder' | translate"
        [disabled]="isChatClosed"
        class="chat__input"
      />
      <button
        type="submit"
        [disabled]="
          !messageContent.trim() || isChatClosed || assistantStatus === 'typing'
        "
        class="chat__send-button"
      >
        <svg
          class="chat__send-button-icon"
          [class.chat__send-button-icon--rtl]="currentLang === 'ar'"
          viewBox="0 0 19 19"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M18.2346 2.68609C18.6666 1.49109 17.5086 0.33309 16.3136 0.76609L1.70855 6.04809C0.509554 6.48209 0.364554 8.11809 1.46755 8.75709L6.12955 11.4561L10.2926 7.29309C10.4812 7.11093 10.7338 7.01014 10.996 7.01242C11.2582 7.01469 11.509 7.11986 11.6944 7.30527C11.8798 7.49068 11.9849 7.74149 11.9872 8.00369C11.9895 8.26589 11.8887 8.51849 11.7066 8.70709L7.54355 12.8701L10.2436 17.5321C10.8816 18.6351 12.5176 18.4891 12.9516 17.2911L18.2346 2.68609Z"
            fill="white"
          />
        </svg>
      </button>
    </div>
  </form>
</div>
