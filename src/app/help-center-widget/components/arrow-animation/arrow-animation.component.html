@if (showArrowAnimation && !isPopupOpen) {
<div class="arrow-animation">
  <div class="message-box">
    <p>
      {{
        messageLabel ||
          "Need assistance Or You want to try the Product? Click here"
      }}
    </p>
    <button class="close-button" (click)="handleCloseArrowAnimation()">
      <svg width="12" height="12" viewBox="0 0 12 12">
        <path
          d="M1 1L11 11M1 11L11 1"
          stroke="currentColor"
          strokeWidth="2"
        />
      </svg>
    </button>
    <div class="arrow-tip"></div>
  </div>
</div>
}
