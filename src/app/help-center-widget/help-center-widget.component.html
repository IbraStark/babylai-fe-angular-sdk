<div class="help-center-container" [dir]="getDirection()">
  <!-- TEST: Version mismatch fixed - Arrow Animation - SUCCESS! -->
  <app-arrow-animation
    [showArrowAnimation]="showArrowAnimation"
    [isPopupOpen]="isPopupOpen"
    [messageLabel]="messageLabel"
    (closeArrowAnimation)="handleCloseArrowAnimation()"
  ></app-arrow-animation>

  <!-- Help Button -->
  <app-help-button (togglePopup)="handleTogglePopup()"></app-help-button>

  <!-- Help Popup -->
  <app-help-popup
    [isPopupOpen]="isPopupOpen"
    [showHelpScreenData]="showHelpScreenData"
    [showChat]="showChat"
    [status]="status"
    [error]="error"
    [helpScreenData]="helpScreenData"
    [messages]="messages"
    [needsAgent]="needsAgent"
    [assistantStatus]="assistantStatus"
    [isAblyConnected]="isAblyConnected"
    [isChatClosed]="isChatClosed"
    [currentLang]="currentLang"
    [chatIsLoading]="chatIsLoading"
    [sessionId]="sessionId"
    [isIntroScreenEnabled]="isIntroScreenEnabled"
    [selectedOption]="selectedOption"
    [selectedNestedOption]="selectedNestedOption"
    [showEndChatConfirmation]="showEndChatConfirmation"
    (closePopup)="handleClosePopup()"
    (back)="handleBack()"
    (showChatEvent)="handleShowChat()"
    (endChat)="handleEndChat()"
    (confirmEndChat)="confirmEndChat()"
    (cancelEndChat)="cancelEndChat()"
    (sendMessageEvent)="sendMessage($event)"
    (startNewChat)="handleStartNewChat($event)"
    (showHelpScreenDataEvent)="handleShowHelpScreenData()"
    (hideHelpScreenData)="handleHideHelpScreenData()"
    (navigateToUrl)="navigateToUrl($event)"
  ></app-help-popup>
</div>
