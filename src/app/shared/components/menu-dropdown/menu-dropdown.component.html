      />
    </svg>
  </app-button>
  @if (isMenuOpen) {
    <div
      class="menu-dropdown__dropdown"
      [ngClass]="{ rtl: isRtl, ltr: !isRtl }"
    >
      <div class="menu-dropdown__content">
        <button
          (click)="onClose.emit(); isMenuOpen = false"
          class="menu-dropdown__button-item"
          [ngClass]="{ rtl: isRtl, ltr: !isRtl }"
        >
          {{ 'EndChat' | translate }}
        </button>
      </div>
    </div>
  }
</div>
